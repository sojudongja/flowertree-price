<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>플라워트리 마스터 가격 검색기 (깃허브 가속엔진)</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .variant-row:nth-child(even) { background-color: #f8fafc; }
        .variant-row:hover td { background-color: #f0fdf4; }
        .ch-th { vertical-align: bottom; padding: 4px 6px 8px 6px; text-align: center; border-right: 1px solid #f1f5f9; white-space: nowrap; font-size: 11px; font-weight: 600; color: #64748b; line-height: 1.6; overflow: hidden; }

        /* 채널 필터 칩 */
        .filter-bar { background: white; border: 1px solid #e2e8f0; border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; }
        .filter-label { font-size: 10px; color: #64748b; font-weight: 600; margin-bottom: 6px; display: block; }
        .chip-group { display: flex; gap: 5px; flex-wrap: nowrap; overflow-x: auto; }
        .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 14px; border: 1px solid #e2e8f0; background: #f8fafc; font-size: 10px; color: #475569; cursor: pointer; user-select: none; transition: all 0.15s; white-space: nowrap; flex-shrink: 0; }
        .chip:hover { border-color: #cbd5e1; }
        .chip.active { background: #ecfdf5; border-color: #6ee7b7; color: #065f46; font-weight: 600; }
        .chip .dot { width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
        .chip.active .dot { background: #10b981; }

        /* 고정 테이블 레이아웃: 컬럼 너비를 전부 명시적으로 고정 */
        .price-table { table-layout: fixed; border-collapse: collapse; text-align: center; }
        .col-code   { width: 155px; }
        .col-color  { width: 70px; }
        .col-sabang { width: 100px; }
        .col-status { width: 90px; }
        .col-ch     { width: 80px; }
        .col-deliv  { width: 90px; }
        .hidden-col { display: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-emerald-500 text-white p-2.5 rounded-xl shadow-md shadow-emerald-100">
                        <i class="fa-solid fa-leaf text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight"> 플라워트리 가격 검색기</h1>
                        <p class="text-xs text-slate-500 mt-0.5">독립 서버 구동형 (실시간 초고속 모드)</p>
                    </div>
                </div>
                <div class="relative flex-1 max-w-xl md:ml-auto">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <input type="text" id="searchInput"
                           class="block w-full pl-10 pr-20 py-3 border border-slate-200 rounded-xl bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm transition-all shadow-inner"
                           placeholder="상품코드, 상품명, 사방넷 품번코드로 검색 (예: ABSG16001, 진달래, 105164)" autofocus>
                    <div class="absolute inset-y-0 right-0 pr-2 flex items-center gap-1">
                        <span id="loadingSpinner" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-emerald-500 border-t-transparent"></span>
                        <button onclick="doSearch()" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg transition-all">검색</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
        <div class="mb-4 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-600 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-database text-slate-400"></i> 총 상품수: <strong id="totalCount" class="text-slate-900 font-semibold">0</strong>개</span>
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-filter text-emerald-500"></i> 검색결과: <strong id="matchCount" class="text-emerald-600 font-bold">0</strong>건 (<strong id="groupCount" class="text-emerald-600 font-bold">0</strong>개 상품)</span>
            </div>
            <div class="flex items-center gap-2 text-xs">
                <span id="connectionStatus" class="inline-flex items-center px-2.5 py-0.5 rounded-full font-medium bg-slate-100 text-slate-500 border border-slate-200">
                    <span class="h-1.5 w-1.5 rounded-full bg-slate-400 mr-1.5"></span>로딩 중
                </span>
            </div>
        </div>

        <!-- 채널 필터 -->
        <div class="filter-bar">
            <span class="filter-label">채널 필터 (선택 시 해당 채널만 표시 · 미선택 시 전체 표시)</span>
            <div class="chip-group" id="channelFilterBar">
                <label class="chip" data-channel="jasa"><span class="dot"></span>자사몰</label>
                <label class="chip" data-channel="coupang"><span class="dot"></span>쿠팡</label>
                <label class="chip" data-channel="naver"><span class="dot"></span>네이버</label>
                <label class="chip" data-channel="ohouse"><span class="dot"></span>오늘의집</label>
                <label class="chip" data-channel="gmarket"><span class="dot"></span>지마켓/옥션/11번가/롯데온</label>
                <label class="chip" data-channel="ssg"><span class="dot"></span>신세계몰/GS SHOP/현대홈쇼핑</label>
                <label class="chip" data-channel="lotte"><span class="dot"></span>CJ온스타일/갓피플몰/홈앤쇼핑/롯데홈쇼핑</label>
                <label class="chip" data-channel="artbox"><span class="dot"></span>핫트랙스/텐바이텐/아트박스</label>
                <label class="chip" data-channel="godpeople"><span class="dot"></span>카카오</label>
            </div>
        </div>

        <div id="resultsContainer" class="grid grid-cols-1 gap-6">
            <div id="statusMessage" class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-slate-300 text-6xl mb-4"><i class="fa-solid fa-folder-open"></i></div>
                <h3 class="text-lg font-medium text-slate-900">데이터를 로드하는 중입니다...</h3>
                <p class="text-slate-400 text-sm mt-1">잠시만 기다려 주세요.</p>
            </div>
        </div>
    </main>

    <script>
        let masterData = [];
        let lastKeyword = "";
        const activeChannels = new Set(); // 비어있으면 전체 표시

        // 채널 정의: key(=class suffix) → {name, priceKey, rateKey, label}
        const CHANNELS = [
            { key: 'jasa',      name: '자사몰',   priceKey: 'jasa',      rateKey: 'jasaRate' },
            { key: 'coupang',   name: '쿠팡',     priceKey: 'coupang',   rateKey: 'coupangRate' },
            { key: 'naver',     name: '네이버',   priceKey: 'naver',     rateKey: 'naverRate' },
            { key: 'ohouse',    name: '오늘의집', priceKey: 'ohouse',    rateKey: 'ohouseRate' },
            { key: 'gmarket',   name: '지마켓/옥션/11번가/롯데온', priceKey: 'gmarket', rateKey: 'gmarketRate', label: '지마켓<br>옥션<br>11번가<br>롯데온' },
            { key: 'ssg',       name: '신세계몰/GS SHOP/현대홈쇼핑', priceKey: 'ssg', rateKey: 'ssgRate', label: '신세계몰<br>GS SHOP<br>현대홈쇼핑' },
            { key: 'lotte',     name: 'CJ온스타일/갓피플몰/홈앤쇼핑/롯데홈쇼핑', priceKey: 'lotte', rateKey: 'lotteRate', label: 'CJ온스타일<br>갓피플몰<br>홈앤쇼핑<br>롯데홈쇼핑' },
            { key: 'artbox',    name: '핫트랙스/텐바이텐/아트박스', priceKey: 'artbox', rateKey: 'artboxRate', label: '핫트랙스<br>텐바이텐<br>아트박스' },
            { key: 'godpeople', name: '카카오',   priceKey: 'godpeople', rateKey: 'godpeopleRate' }
        ];

        async function loadData() {
            const spinner = document.getElementById('loadingSpinner');
            const totalCountEl = document.getElementById('totalCount');
            const statusMessage = document.getElementById('statusMessage');
            const connectionStatus = document.getElementById('connectionStatus');

            spinner.classList.remove('hidden');
            try {
                const response = await fetch('data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('Data load failed');

                masterData = await response.json();
                totalCountEl.textContent = masterData.length.toLocaleString();

                connectionStatus.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>정상 연결됨`;
                connectionStatus.className = "inline-flex items-center px-2.5 py-0.5 rounded-full font-medium bg-emerald-50 text-emerald-700 border border-emerald-100";

                statusMessage.innerHTML = `
                    <div class="text-emerald-500 text-6xl mb-4"><i class="fa-solid fa-circle-check"></i></div>
                    <h3 class="text-lg font-medium text-slate-900">데이터 로드 완료 (${masterData.length.toLocaleString()}개)</h3>
                    <p class="text-slate-500 text-sm mt-1">상품코드, 상품명, 사방넷 품번코드로 검색하세요.</p>
                `;
            } catch (error) {
                console.error(error);
                connectionStatus.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-rose-500 mr-1.5"></span>연결 실패`;
                connectionStatus.className = "inline-flex items-center px-2.5 py-0.5 rounded-full font-medium bg-rose-50 text-rose-700 border border-rose-100";
                statusMessage.innerHTML = `
                    <div class="text-rose-500 text-6xl mb-4"><i class="fa-solid fa-circle-exclamation"></i></div>
                    <h3 class="text-lg font-medium text-slate-900">데이터를 찾을 수 없습니다.</h3>
                    <p class="text-rose-400 text-sm mt-1">구글 중계시트에서 [최신가격 즉시 동기화] 버튼을 한 번 실행해 주세요!</p>
                `;
            } finally {
                initInputListener();
                initChannelFilter();
                spinner.classList.add('hidden');
            }
        }

        function getMainCode(pumbun) { return pumbun.replace(/-\d+$/, ''); }

        function getStatusOrder(status) {
            const s = (status || '').split(',')[0].trim();
            if (s.startsWith('0 판매중') && !s.includes('리뉴얼')) return 0;
            if (s.includes('리뉴얼')) return 1;
            if (s.startsWith('9')) return 2;
            if (s.includes('1차')) return 3;
            if (s.includes('2차')) return 4;
            if (s.includes('3차')) return 5;
            if (s.startsWith('4')) return 6;
            if (s.startsWith('5')) return 7;
            return 8;
        }

        function getVariantNumber(pumbun) {
            const match = pumbun.match(/-(\d+)$/);
            return match ? parseInt(match[1]) : 0;
        }

        function groupByMainCode(filtered) {
            const groupMap = new Map();
            filtered.forEach(item => {
                const mainCode = getMainCode(item.pumbun);
                if (!groupMap.has(mainCode)) groupMap.set(mainCode, []);
                groupMap.get(mainCode).push(item);
            });
            groupMap.forEach((variants) => {
                variants.sort((a, b) => {
                    const statusDiff = getStatusOrder(a.status) - getStatusOrder(b.status);
                    if (statusDiff !== 0) return statusDiff;
                    return getVariantNumber(a.pumbun) - getVariantNumber(b.pumbun);
                });
            });
            return new Map([...groupMap.entries()].sort((a, b) => a[0].localeCompare(b[0])));
        }

        function getVisibleChannelList() {
            if (activeChannels.size === 0) return CHANNELS;
            return CHANNELS.filter(ch => activeChannels.has(ch.key));
        }

        function renderChannelHeaders() {
            const visible = getVisibleChannelList();
            const emptyCount = CHANNELS.length - visible.length;
            let html = visible.map(ch => {
                const label = ch.label || ch.name;
                return `<th class="ch-th col-ch">${label}</th>`;
            }).join('');
            // 선택 안 한 만큼 빈 칸으로 채움 (배송구분 앞까지 위치 고정)
            for (let i = 0; i < emptyCount; i++) {
                html += `<th class="ch-th col-ch" style="border-right:1px solid #f1f5f9;"></th>`;
            }
            return html;
        }

        function renderChannelCells(v) {
            const visible = getVisibleChannelList();
            const emptyCount = CHANNELS.length - visible.length;
            let html = visible.map(ch => {
                const price = v[ch.priceKey];
                const rate = v[ch.rateKey];
                return `<td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap col-ch">
                            <div class="font-bold text-slate-800">${price}</div>
                            <div class="text-[10px] text-slate-400">${rate}</div>
                        </td>`;
            }).join('');
            for (let i = 0; i < emptyCount; i++) {
                html += `<td class="py-2 px-3 border-r border-slate-100 col-ch"></td>`;
            }
            return html;
        }

        function performSearch(keyword) {
            lastKeyword = keyword;
            const container = document.getElementById('resultsContainer');
            const matchCountEl = document.getElementById('matchCount');
            const groupCountEl = document.getElementById('groupCount');

            if (!keyword || keyword.trim() === "") {
                matchCountEl.textContent = "0";
                groupCountEl.textContent = "0";
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div class="text-slate-300 text-6xl mb-4"><i class="fa-solid fa-keyboard"></i></div>
                        <h3 class="text-lg font-medium text-slate-900">검색어를 입력해 주세요.</h3>
                        <p class="text-slate-400 text-sm mt-1">상품코드, 상품명, 사방넷 품번코드 모두 검색 가능합니다.</p>
                    </div>`;
                return;
            }

            const cleanKeyword = keyword.toLowerCase().replace(/\s+/g, "");
            const filtered = masterData.filter(item => {
                var a = item.pumbunLow     ? String(item.pumbunLow).replace(/\s+/g, "")     : "";
                var b = item.prodNameLow   ? String(item.prodNameLow).replace(/\s+/g, "")   : "";
                var c = item.sabangCodeLow ? String(item.sabangCodeLow).replace(/\s+/g, "") : "";
                return a.includes(cleanKeyword) || b.includes(cleanKeyword) || c.includes(cleanKeyword);
            });

            const grouped = groupByMainCode(filtered);
            matchCountEl.textContent = filtered.length.toLocaleString();
            groupCountEl.textContent = grouped.size.toLocaleString();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div class="text-slate-300 text-6xl mb-4"><i class="fa-solid fa-magnifying-glass-minus"></i></div>
                        <h3 class="text-lg font-medium text-slate-900">'${keyword}'에 매칭되는 상품이 없습니다.</h3>
                        <p class="text-slate-400 text-sm mt-1">상품코드, 상품명, 사방넷 품번코드를 확인해 주세요.</p>
                    </div>`;
                return;
            }

            renderResults(grouped);
        }

        function renderResults(grouped) {
            const container = document.getElementById('resultsContainer');
            let htmlString = "";

            grouped.forEach((variants, mainCode) => {
                const rep = variants[0];
                const linkHref = rep.link && rep.link !== "#" ? rep.link.trim() : null;
                const linkBtn = linkHref
                    ? `<a href="${linkHref}" target="_blank" class="inline-flex items-center gap-1 px-2 py-0.5 rounded bg-slate-100 hover:bg-emerald-50 hover:text-emerald-700 text-slate-500 text-xs transition-all flex-shrink-0">
                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i> 바로가기
                       </a>` : "";
                const titleLink = `<span class="text-base font-bold text-slate-900 flex-shrink-0">${mainCode}</span>
                                   <span class="text-slate-300 flex-shrink-0">|</span>
                                   <span class="text-base font-bold text-slate-900">${rep.prodName}</span>
                                   ${linkBtn}`;

                let variantRows = "";
                variants.forEach(v => {
                    variantRows += `
                        <tr class="variant-row text-xs">
                            <td class="py-2 px-3 border-r border-slate-100 font-mono text-slate-600 whitespace-nowrap text-sm col-code" style="text-align:center !important;">${v.pumbun}</td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap col-color">${v.color || '-'}</td>
                            <td class="py-2 px-3 border-r border-slate-100 text-slate-400 whitespace-nowrap col-sabang">${v.sabangCode || '-'}</td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap col-status">
                                ${(v.status || '-').split(',').map(s => {
                                    const t = s.trim();
                                    if (!t || t === '-') return '';
                                    let cls = '';
                                    if (t.startsWith('-')) cls = 'background:#f1f5f9; color:#94a3b8;';
                                    else if (t.includes('신규')) cls = 'background:#ede9fe; color:#5b21b6;';
                                    else if (t.includes('리뉴얼')) cls = 'background:#bfdbfe; color:#1d4ed8;';
                                    else if (t.includes('판매중지')) cls = 'background:#fee2e2; color:#b91c1c;';
                                    else if (t.includes('3차')) cls = 'background:#fecaca; color:#991b1b;';
                                    else if (t.includes('2차')) cls = 'background:#fed7aa; color:#9a3412;';
                                    else if (t.includes('1차')) cls = 'background:#fef9c3; color:#854d0e;';
                                    else if (t.includes('판매중')) cls = 'background:#dbeafe; color:#1e40af;';
                                    else if (t.includes('단종')) cls = 'background:#e2e8f0; color:#475569;';
                                    else cls = 'background:#f1f5f9; color:#94a3b8;';
                                    return `<span style="display:inline-block; margin:1px 2px; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:500; ${cls}">${t}</span>`;
                                }).join('')}
                            </td>
                            ${renderChannelCells(v)}
                            <td class="py-2 px-3 text-slate-500 leading-relaxed text-[11px] whitespace-nowrap col-deliv">${v.delivery}</td>
                        </tr>`;
                });

                htmlString += `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-all">
                    <div class="p-4 flex items-center gap-4 border-b border-slate-100 bg-slate-50/50">
                        <img src="${rep.img}" alt="상품이미지" onerror="this.src='https://placehold.co/64x64?text=No+Img'"
                             class="w-14 h-14 rounded-xl object-cover border border-slate-200 bg-white shadow-sm flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap mb-1">
                                <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">${rep.regSheet}</span>
                                <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-200 text-slate-600">중요코드: ${rep.importantCode || '-'}</span>
                                <span class="text-xs text-slate-400">${variants.length}개 옵션</span>
                            </div>
                            <h2 class="text-base text-slate-900 flex items-center gap-2 flex-wrap">${titleLink}</h2>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <div class="text-xs text-slate-400 mb-1">정산가 · 배율 · 원가</div>
                            <div class="flex items-baseline gap-1.5 justify-end flex-wrap">
                                <span class="text-lg font-extrabold text-slate-900">${rep.jungSan}</span>
                                <span class="text-xs font-semibold text-sky-700 bg-sky-100 px-1.5 py-0.5 rounded">× ${rep.jungSanRate}</span>
                                <span class="text-xs text-slate-400">(원가 ${rep.wonGa})</span>
                            </div>
                        </div>
                    </div>
                    <div class="overflow-x-auto no-scrollbar">
                        <table class="price-table" style="min-width:${155+70+100+90+(CHANNELS.length*80)+90}px; width:100%; max-width:${155+70+100+90+(CHANNELS.length*80)+90}px;">
                            <thead>
                                <tr class="bg-slate-100/70 border-b border-slate-200">
                                    <th class="py-2 px-3 border-r border-slate-100 text-left whitespace-nowrap text-[11px] font-medium text-slate-500 col-code" style="vertical-align:bottom;">상품코드</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap text-[11px] font-medium text-slate-500 col-color" style="vertical-align:bottom;">색상</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap text-[11px] font-medium text-slate-500 col-sabang" style="vertical-align:bottom;">사방넷 품번코드</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap text-[11px] font-medium text-slate-500 col-status" style="vertical-align:bottom;">판매상태</th>
                                    ${renderChannelHeaders()}
                                    <th class="py-2 px-3 whitespace-nowrap text-[11px] font-medium text-slate-500 col-deliv" style="vertical-align:bottom;">배송구분</th>
                                </tr>
                            </thead>
                            <tbody>${variantRows}</tbody>
                        </table>
                    </div>
                </div>`;
            });

            container.innerHTML = htmlString;
        }

        function initChannelFilter() {
            const bar = document.getElementById('channelFilterBar');
            if (!bar) return;
            bar.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    const key = chip.dataset.channel;
                    if (activeChannels.has(key)) {
                        activeChannels.delete(key);
                        chip.classList.remove('active');
                    } else {
                        activeChannels.add(key);
                        chip.classList.add('active');
                    }
                    // 채널 선택이 바뀌면 현재 검색 결과를 다시 그려서 컬럼을 앞으로 당김
                    if (lastKeyword && lastKeyword.trim() !== "") {
                        performSearch(lastKeyword);
                    }
                });
            });
        }

        function doSearch() {
            const inputEl = document.getElementById('searchInput');
            if (inputEl) performSearch(inputEl.value);
        }

        function initInputListener() {
            const inputEl = document.getElementById('searchInput');
            if (inputEl) {
                inputEl.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') performSearch(e.target.value);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
