<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 플라워트리 마스터 가격 검색기 (깃허브 가속엔진)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-emerald-500 text-white p-2.5 rounded-xl shadow-md shadow-emerald-100">
                        <i class="fa-solid fa-leaf text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">🌿 플라워트리 마스터 가격 검색기</h1>
                        <p class="text-xs text-slate-500 mt-0.5">깃허브 독립 서버 구동형 (실시간 0.01초 초고속 검색 모드)</p>
                    </div>
                </div>
                
                <div class="relative flex-1 max-w-xl md:ml-auto">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <input type="text" id="searchInput" 
                           class="block w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm transition-all shadow-inner"
                           placeholder="품번 또는 상품명을 입력하세요... (예: 크리스마스트리, 21-A)" autofocus>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <span id="loadingSpinner" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-emerald-500 border-t-transparent"></span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-600 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-database text-slate-400"></i> 총 상품수: <strong id="totalCount" class="text-slate-900 font-semibold">0</strong>개</span>
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-filter text-emerald-500"></i> 검색결과: <strong id="matchCount" class="text-emerald-600 font-bold">0</strong>개</span>
            </div>
            <div class="flex items-center gap-2 text-xs">
                <span class="inline-flex items-center px-2.5 py-0.5 rounded-full font-medium bg-emerald-50 text-emerald-700 border border-emerald-100">
                    <span class="h-1.5 w-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>정상 연결됨
                </span>
            </div>
        </div>

        <div id="resultsContainer" class="grid grid-cols-1 gap-6">
            <div id="statusMessage" class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-slate-300 text-6xl mb-4">
                    <i class="fa-solid fa-folder-open"></i>
                </div>
                <h3 class="text-lg font-medium text-slate-900">데이터를 로드하는 중이거나 검색 대기 중입니다.</h3>
                <p class="text-slate-400 text-sm mt-1">상단 검색창에 품번이나 상품명을 입력해 주세요.</p>
            </div>
        </div>
    </main>

    <script>
        let masterData = [];

        async function loadData() {
            const spinner = document.getElementById('loadingSpinner');
            const totalCountEl = document.getElementById('totalCount');
            const statusMessage = document.getElementById('statusMessage');
            
            spinner.classList.remove('hidden');
            try {
                const response = await fetch('data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('Data load failed');
                
                masterData = await response.json();
                totalCountEl.textContent = masterData.length.toLocaleString();
                
                statusMessage.innerHTML = `
                    <div class="text-emerald-500 text-6xl mb-4"><i class="fa-solid fa-circle-check"></i></div>
                    <h3 class="text-lg font-medium text-slate-900">실시간 데이터 로드 완료!</h3>
                    <p class="text-slate-500 text-sm mt-1">검색어를 입력하시면 0.01초 만에 결과를 필터링합니다.</p>
                `;
            } catch (error) {
                console.error(error);
                statusMessage.innerHTML = `
                    <div class="text-rose-500 text-6xl mb-4"><i class="fa-solid fa-circle-exclamation"></i></div>
                    <h3 class="text-lg font-medium text-slate-900">데이터를 찾을 수 없습니다.</h3>
                    <p class="text-rose-400 text-sm mt-1">구글 중계시트에서 [최신가격 즉시 동기화] 버튼을 한 번 실행해 주세요!</p>
                `;
            } finally {
                spinner.classList.add('hidden');
            }
        }

        function performSearch(keyword) {
            const container = document.getElementById('resultsContainer');
            const matchCountEl = document.getElementById('matchCount');
            
            if (!keyword || keyword.trim() === "") {
                matchCountEl.textContent = "0";
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div class="text-slate-300 text-6xl mb-4"><i class="fa-solid fa-keyboard"></i></div>
                        <h3 class="text-lg font-medium text-slate-900">검색어를 입력해 주세요.</h3>
                    </div>
                `;
                return;
            }

            const cleanKeyword = keyword.toLowerCase().trim();
            
            const filtered = masterData.filter(item => {
                return (item.pumbunLow && item.pumbunLow.includes(cleanKeyword)) || 
                       (item.prodNameLow && item.prodNameLow.includes(cleanKeyword));
            });

            matchCountEl.textContent = filtered.length.toLocaleString();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div class="text-slate-300 text-6xl mb-4"><i class="fa-solid fa-magnifying-glass-minus"></i></div>
                        <h3 class="text-lg font-medium text-slate-900">'${keyword}'에 매칭되는 상품이 없습니다.</h3>
                    </div>
                `;
                return;
            }

            let htmlString = "";
            filtered.forEach(item => {
                htmlString += `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-all">
                    <div class="p-5 flex flex-col lg:flex-row items-start lg:items-center justify-between gap-4 border-b border-slate-100 bg-slate-50/50">
                        <div class="flex items-center gap-4">
                            <img src="${item.img}" alt="상품이미지" onerror="this.src='https://placehold.co/80x80?text=No+Img'" class="w-16 h-16 rounded-xl object-cover border border-slate-200 bg-white shadow-sm flex-shrink-0">
                            <div>
                                <div class="flex items-center gap-2 flex-wrap">
                                    <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2.5 py-0.5 rounded-md border border-emerald-100">${item.regSheet} 시트</span>
                                    <span class="text-xs text-slate-400 font-medium">${item.rowNo}번째 줄</span>
                                    <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-200 text-slate-700">${item.status}</span>
                                </div>
                                <h2 class="text-base font-bold text-slate-900 mt-1.5">
                                    <a href="${item.link}" target="_blank" class="hover:text-emerald-600 hover:underline inline-flex items-center gap-1.5">
                                        [${item.pumbun}] ${item.prodName} <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400"></i>
                                    </a>
                                </h2>
                                <p class="text-xs text-slate-500 mt-0.5">색상: ${item.color || '-'} | 주요코드: ${item.importantCode || '-'}</p>
                            </div>
                        </div>
                        <div class="flex flex-row lg:flex-col items-center lg:items-end justify-between w-full lg:w-auto border-t lg:border-t-0 pt-3 lg:pt-0 border-slate-100 gap-2">
                            <div class="text-xs text-slate-400">정산가 (원가)</div>
                            <div class="text-right">
                                <span class="text-lg font-extrabold text-slate-900">${item.jungSan}</span>
                                <span class="text-xs text-slate-400 font-medium">(${item.wonGa})</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="overflow-x-auto no-scrollbar">
                        <table class="w-full text-center text-xs whitespace-nowrap min-w-[900px]">
                            <thead>
                                <tr class="bg-slate-100/50 text-slate-500 font-medium border-b border-slate-200">
                                    <th class="py-2.5 px-3 border-r border-slate-100">자사몰</th>
                                    <th class="py-2.5 px-3 border-r border-slate-100">쿠팡</th>
                                    <th class="py-2.5 px-3 border-r border-slate-100">네이버</th>
                                    <th class="py-2.5 px-3 border-r border-slate-100 text-emerald-700 bg-emerald-50/50">오늘의집</th>
                                    <th class="py-2.5 px-3 border-r border-slate-100">지마켓</th>
                                    <th class="py-2.5 px-3 border-r border-slate-100">신세계</th>
                                    <th class="py-2.5 px-3 border-r border-slate-100">롯데홈</th>
                                    <th class="py-2.5 px-3 border-r border-slate-100">아트박스</th>
                                    <th class="py-2.5 px-3 border-r border-slate-100">갓피플</th>
                                    <th class="py-2.5 px-3">배송구분</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr class="text-slate-700 font-medium hover:bg-slate-50/50 transition-all">
                                    <td class="py-3 px-3 border-r border-slate-100"><div>${item.jasa}</div><div class="text-[10px] text-slate-400 mt-0.5">${item.jasaRate}%</div></td>
                                    <td class="py-3 px-3 border-r border-slate-100"><div>${item.coupang}</div><div class="text-[10px] text-slate-400 mt-0.5">${item.coupangRate}%</div></td>
                                    <td class="py-3 px-3 border-r border-slate-100"><div>${item.naver}</div><div class="text-[10px] text-slate-400 mt-0.5">${item.naverRate}%</div></td>
                                    <td class="py-3 px-3 border-r border-slate-100 text-emerald-900 bg-emerald-50/20"><div class="font-extrabold text-emerald-700">${item.ohouse}</div><div class="text-[10px] text-emerald-500 mt-0.5 font-semibold">${item.ohouseRate}%</div></td>
                                    <td class="py-3 px-3 border-r border-slate-100"><div>${item.gmarket}</div><div class="text-[10px] text-slate-400 mt-0.5">${item.gmarketRate}%</div></td>
                                    <td class="py-3 px-3 border-r border-slate-100"><div>${item.ssg}</div><div class="text-[10px] text-slate-400 mt-0.5">${item.ssgRate}%</div></td>
                                    <td class="py-3 px-3 border-r border-slate-100"><div>${item.lotte}</div><div class="text-[10px] text-slate-400 mt-0.5">${item.lotteRate}%</div></td>
                                    <td class="py-3 px-3 border-r border-slate-100"><div>${item.artbox}</div><div class="text-[10px] text-slate-400 mt-0.5">${item.artboxRate}%</div></td>
                                    <td class="py-3 px-3 border-r border-slate-100"><div>${item.godpeople}</div><div class="text-[10px] text-slate-400 mt-0.5">${item.godpeopleRate}%</div></td>
                                    <td class="py-3 px-3 text-slate-500 font-normal leading-relaxed text-[11px]">${item.delivery}</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                `;
            });
            container.innerHTML = htmlString;
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            performSearch(e.target.value);
        });

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
