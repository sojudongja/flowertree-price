<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌿 플라워트리 가격 검색기 (깃허브 초고속 최적화판)</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
    }
    .container {
      max-width: 100%;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }
    .header-zone {
      text-align: center;
      margin-bottom: 25px;
    }
    .header-zone h1 {
      color: #1e4d2b;
      margin: 0 0 5px 0;
      font-size: 26px;
    }
    .header-zone p {
      color: #666;
      margin: 0;
      font-size: 13px;
    }
    .search-zone {
      max-width: 550px;
      margin: 0 auto 25px auto;
    }
    input[type="text"] {
      width: 100%;
      padding: 13px 20px;
      font-size: 15px;
      border: 2px solid #e1e8e5;
      border-radius: 30px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.3s;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    input[type="text"]:focus {
      border-color: #2e7d32;
      box-shadow: 0 4px 10px rgba(46,125,50,0.1);
    }
    .status-msg {
      text-align: center;
      font-weight: bold;
      color: #2e7d32;
      margin-bottom: 15px;
      font-size: 13px;
    }
    
    /* 📌 깃허브 전용 초경량 가속 테이블 레이아웃 */
    .table-wrapper {
      overflow-x: auto;
      max-height: 750px;
      border: 1px solid #e1e8e5;
      border-radius: 8px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      text-align: center;
      min-width: 2400px;
    }
    th, td {
      border: 1px solid #e1e8e5;
      padding: 10px 6px;
      vertical-align: middle;
    }
    th {
      background-color: #f8faf9;
      color: #445247;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 5;
    }
    
    /* 최적화 구역별 고유 컬러 에센스 */
    .section-master { background-color: #edf7ed; color: #1e4620; font-weight: bold; }
    .section-jasa { background-color: #e3fafc; }
    .section-coupang { background-color: #fff4e6; }
    .section-naver { background-color: #ebfbee; }
    .section-ohouse { background-color: #e6fcff; }
    .section-etc { background-color: #f1f3f5; }
    
    tr:hover { background-color: #fafafa; }
    
    img.prod-thumb {
      width: 48px;
      height: 48px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #ddd;
    }
    .link-badge {
      display: inline-block;
      background-color: #2e7d32;
      color: #fff;
      padding: 5px 10px;
      text-decoration: none;
      border-radius: 4px;
      font-weight: bold;
      font-size: 11px;
    }
    .link-badge:hover { background-color: #1b5e20; }
    .state-txt {
      display: inline-block;
      background: #eee;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
    }
    .bold-price { font-weight: 700; color: #111; }
    .empty-row { text-align: center; color: #999; padding: 5px; font-size: 14px; }
  </style>
</head>
<body>

<div class="container">
  <div class="header-zone">
    <h1>🌿 플라워트리 마스터 종합 가격 검색기</h1>
    <p>⚡ 깃허브 초고속 엔진 최적화 뷰어</p>
  </div>
  
  <div class="search-zone">
    <input type="text" id="searchKeyword" placeholder="품번 또는 상품명을 입력하면 즉시 필터링됩니다..." oninput="filterStaticData()">
  </div>
  
  <div id="statusReport" class="status-msg">🔄 카탈로그 데이터를 동기화하는 중입니다...</div>
  
  <div class="table-wrapper">
    <table>
      <thead>
        <tr>
          <th class="section-master" style="width:100px;">개별상품코드</th>
          <th style="width:70px;">바로가기</th>
          <th style="width:90px;">등록시트</th>
          <th style="width:60px;">행번호</th>
          <th style="width:60px;">이미지</th>
          <th>메인 상품명(기입)</th>
          <th style="width:100px;">색상(기입)</th>
          <th style="width:90px;">중요코드</th>
          <th style="width:70px;">판매상태</th>
          <th style="width:100px;">개별품번코드</th>
          <th style="width:90px; color:#c92a2a;">정산가</th>
          <th style="width:60px;">정산배율</th>
          <th style="width:80px;">원가</th>
          <th style="width:80px;">배송구분</th>
          
          <th class="section-jasa" style="width:90px;">자사몰가</th><th class="section-jasa" style="width:60px;">배율</th>
          <th class="section-coupang" style="width:90px;">쿠팡가</th><th class="section-coupang" style="width:60px;">배율</th>
          <th class="section-naver" style="width:90px;">네이버가</th><th class="section-naver" style="width:60px;">배율</th>
          <th class="section-ohouse" style="width:100px;">오늘의집가</th><th class="section-ohouse" style="width:60px;">배율</th>
          
          <th class="section-etc" style="width:90px;">G마켓가</th><th class="section-etc" style="width:60px;">배율</th>
          <th class="section-etc" style="width:90px;">SSG가</th><th class="section-etc" style="width:60px;">배율</th>
          <th class="section-etc" style="width:90px;">롯데홈가</th><th class="section-etc" style="width:60px;">배율</th>
          <th class="section-etc" style="width:90px;">아트박스가</th><th class="section-etc" style="width:60px;">배율</th>
          <th class="section-etc" style="width:90px;">갓피플가</th><th class="section-etc" style="width:60px;">배율</th>
        </tr>
      </thead>
      <tbody id="catalogBody">
        <tr>
          <td colspan="34" class="empty-row">데이터 동기화 완료 대기 중...</td>
        </tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  let localDataset = [];

  // 깃허브 배포 즉시 data.json 호출
  async function startupApplication() {
    try {
      const res = await fetch('data.json?t=' + new Date().getTime());
      if (!res.ok) throw new Error('Data fetch failed');
      localDataset = await res.json();
      
      document.getElementById("statusReport").textContent = "🟢 실시간 초고속 동기화 완료 (총 " + localDataset.length.toLocaleString() + "개 품목 맵핑됨)";
      document.getElementById("catalogBody").innerHTML = "<tr><td colspan='34' class='empty-row'>검색창에 품번이나 상품명을 입력해 주세요.</td></tr>";
    } catch(e) {
      document.getElementById("statusReport").style.color = "#c92a2a";
      document.getElementById("statusReport").textContent = "❌ data.json 로드 실패. 중계시트에서 전체 동기화를 실행해 주세요.";
    }
  }

  // 실시간 0.01초 필터 서칭
  function filterStaticData() {
    var txt = document.getElementById("searchKeyword").value.trim().toLowerCase();
    var tbody = document.getElementById("catalogBody");
    
    if(!txt) {
      tbody.innerHTML = "<tr><td colspan='34' class='empty-row'>검색창에 품번이나 상품명을 입력해 주세요.</td></tr>";
      return;
    }
    
    // 🛠️ 완치 반영: 하이픈 뒤 상세옵션(-1, -2) 유연 부분일치 필터 서칭
    const matched = localDataset.filter(item => {
      var kPumbun = item.pumbunLow ? item.pumbunLow : "";
      var kName = item.prodNameLow ? item.prodNameLow : "";
      return kPumbun.includes(txt) || kName.includes(txt);
    });
    
    if(matched.length === 0) {
      tbody.innerHTML = "<tr><td colspan='34' class='empty-row'>⚠️ 검색 조건과 일치하는 판매가 데이터가 없습니다.</td></tr>";
      return;
    }
    
    var resHtml = "";
    for(var i=0; i<matched.length; i++) {
      var row = matched[i];
      
      // 🛠️ 완치 반영: P열 실제 링크 가로채기 복구 검증 마감
      var urlTag = "-";
      if(row.link && row.link !== "#" && row.link.trim() !== "") {
        urlTag = "<a href='" + row.link.trim() + "' target='_blank' class='link-badge'>🔗 이동</a>";
      }
      
      var imgTag = row.img ? "<img src='" + row.img + "' class='prod-thumb' onerror='this.style.display=\"none\";'>" : "<span style='color:#bbb;'>No Img</span>";
      
      resHtml += "<tr>" +
        "<td class='section-master'>" + row.pumbun + "</td>" +
        "<td>" + urlTag + "</td>" +
        "<td>" + row.regSheet + "</td>" +
        "<td>" + row.rowNo + "</td>" +
        "<td>" + imgTag + "</td>" +
        "<td style='text-align:left; font-weight:500;'>" + row.prodName + "</td>" +
        "<td>" + (row.color || "-") + "</td>" +
        "<td><code>" + (row.importantCode || "-") + "</code></td>" +
        "<td><span class='state-txt'>" + row.status + "</span></td>" +
        "<td>" + row.subPumbun + "</td>" +
        "<td class='bold-price' style='color:#c92a2a;'>" + row.jungSan + "</td>" +
        "<td class='rate-col'>" + row.jungSanRate + "</td>" +
        "<td>" + row.wonGa + "</td>" +
        "<td>" + row.delivery + "</td>" +
        
        "<td class='bold-price'>" + row.jasa + "</td><td class='rate-col'>" + row.jasaRate + "</td>" +
        "<td class='bold-price'>" + row.coupang + "</td><td class='rate-col'>" + row.coupangRate + "</td>" +
        "<td class='bold-price'>" + row.naver + "</td><td class='rate-col'>" + row.naverRate + "</td>" +
        "<td class='bold-price'>" + row.ohouse + "</td><td class='rate-col'>" + row.ohouseRate + "</td>" +
        
        "<td class='bold-price'>" + row.gmarket + "</td><td class='rate-col'>" + row.gmarketRate + "</td>" +
        "<td class='bold-price'>" + row.ssg + "</td><td class='rate-col'>" + row.ssgRate + "</td>" +
        "<td class='bold-price'>" + row.lotte + "</td><td class='rate-col'>" + r.lotteRate + "</td>" +
        "<td class='bold-price'>" + row.artbox + "</td><td class='rate-col'>" + row.artboxRate + "</td>" +
        "<td class='bold-price'>" + row.godpeople + "</td><td class='rate-col'>" + row.godpeopleRate + "</td>" +
      "</tr>";
    }
    tbody.innerHTML = resHtml;
  }

  window.addEventListener('DOMContentLoaded', startupApplication);
</script>

</body>
</html>
