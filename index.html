<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌿 플라워트리 마스터 가격 검색기 (깃허브 가속엔진)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f8fafc; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .variant-row:hover { background-color: #f0fdf4; }
        .variant-row:nth-child(even) { background-color: #f8fafc; }
        .variant-row:nth-child(even):hover { background-color: #f0fdf4; }
        .th-wrap { white-space: normal; line-height: 1.4; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">

    <header class="sticky top-0 z-50 bg-white border-b border-slate-200 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8">
            <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-emerald-500 text-white p-2.5 rounded-xl shadow-md shadow-emerald-100">
                        <i class="fa-solid fa-leaf text-xl"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight"> 플라워트리 가격 검색기</h1>
                        <p class="text-xs text-slate-500 mt-0.5">독립 서버 구동형 (실시간 초고속 모드)</p>
                    </div>
                </div>
                <div class="relative flex-1 max-w-xl md:ml-auto">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </div>
                    <input type="text" id="searchInput"
                           class="block w-full pl-10 pr-12 py-3 border border-slate-200 rounded-xl bg-slate-50 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 text-sm transition-all shadow-inner"
                           placeholder="상품코드, 상품명, 사방넷 품번코드로 검색 (예: ABSG16001, 진달래, 105164)" autofocus>
                    <div class="absolute inset-y-0 right-0 pr-3 flex items-center">
                        <span id="loadingSpinner" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-emerald-500 border-t-transparent"></span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8">
        <div class="mb-6 flex flex-wrap items-center justify-between gap-3 text-sm text-slate-600 bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
            <div class="flex items-center gap-4">
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-database text-slate-400"></i> 총 상품수: <strong id="totalCount" class="text-slate-900 font-semibold">0</strong>개</span>
                <span class="flex items-center gap-1.5"><i class="fa-solid fa-filter text-emerald-500"></i> 검색결과: <strong id="matchCount" class="text-emerald-600 font-bold">0</strong>건 (<strong id="groupCount" class="text-emerald-600 font-bold">0</strong>개 상품)</span>
            </div>
            <div class="flex items-center gap-2 text-xs">
                <span id="connectionStatus" class="inline-flex items-center px-2.5 py-0.5 rounded-full font-medium bg-slate-100 text-slate-500 border border-slate-200">
                    <span class="h-1.5 w-1.5 rounded-full bg-slate-400 mr-1.5"></span>로딩 중
                </span>
            </div>
        </div>

        <div id="resultsContainer" class="grid grid-cols-1 gap-6">
            <div id="statusMessage" class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                <div class="text-slate-300 text-6xl mb-4"><i class="fa-solid fa-folder-open"></i></div>
                <h3 class="text-lg font-medium text-slate-900">데이터를 로드하는 중입니다...</h3>
                <p class="text-slate-400 text-sm mt-1">잠시만 기다려 주세요.</p>
            </div>
        </div>
    </main>

    <script>
        let masterData = [];

        async function loadData() {
            const spinner = document.getElementById('loadingSpinner');
            const totalCountEl = document.getElementById('totalCount');
            const statusMessage = document.getElementById('statusMessage');
            const connectionStatus = document.getElementById('connectionStatus');

            spinner.classList.remove('hidden');
            try {
                const response = await fetch('data.json?v=' + new Date().getTime());
                if (!response.ok) throw new Error('Data load failed');

                masterData = await response.json();
                totalCountEl.textContent = masterData.length.toLocaleString();

                connectionStatus.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>정상 연결됨`;
                connectionStatus.className = "inline-flex items-center px-2.5 py-0.5 rounded-full font-medium bg-emerald-50 text-emerald-700 border border-emerald-100";

                statusMessage.innerHTML = `
                    <div class="text-emerald-500 text-6xl mb-4"><i class="fa-solid fa-circle-check"></i></div>
                    <h3 class="text-lg font-medium text-slate-900">데이터 로드 완료 (${masterData.length.toLocaleString()}개)</h3>
                    <p class="text-slate-500 text-sm mt-1">상품코드, 상품명, 사방넷 품번코드로 검색하세요.</p>
                `;
            } catch (error) {
                console.error(error);
                connectionStatus.innerHTML = `<span class="h-1.5 w-1.5 rounded-full bg-rose-500 mr-1.5"></span>연결 실패`;
                connectionStatus.className = "inline-flex items-center px-2.5 py-0.5 rounded-full font-medium bg-rose-50 text-rose-700 border border-rose-100";
                statusMessage.innerHTML = `
                    <div class="text-rose-500 text-6xl mb-4"><i class="fa-solid fa-circle-exclamation"></i></div>
                    <h3 class="text-lg font-medium text-slate-900">데이터를 찾을 수 없습니다.</h3>
                    <p class="text-rose-400 text-sm mt-1">구글 중계시트에서 [최신가격 즉시 동기화] 버튼을 한 번 실행해 주세요!</p>
                `;
            } finally {
                initInputListener();
                spinner.classList.add('hidden');
            }
        }

        function getMainCode(pumbun) {
            return pumbun.replace(/-\d+$/, '');
        }

        function groupByMainCode(filtered) {
            const groupMap = new Map();
            filtered.forEach(item => {
                const mainCode = getMainCode(item.pumbun);
                if (!groupMap.has(mainCode)) groupMap.set(mainCode, []);
                groupMap.get(mainCode).push(item);
            });
            return groupMap;
        }

        function performSearch(keyword) {
            const container = document.getElementById('resultsContainer');
            const matchCountEl = document.getElementById('matchCount');
            const groupCountEl = document.getElementById('groupCount');

            if (!keyword || keyword.trim() === "") {
                matchCountEl.textContent = "0";
                groupCountEl.textContent = "0";
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div class="text-slate-300 text-6xl mb-4"><i class="fa-solid fa-keyboard"></i></div>
                        <h3 class="text-lg font-medium text-slate-900">검색어를 입력해 주세요.</h3>
                        <p class="text-slate-400 text-sm mt-1">상품코드, 상품명, 사방넷 품번코드 모두 검색 가능합니다.</p>
                    </div>
                `;
                return;
            }

            const cleanKeyword = keyword.toLowerCase().replace(/\s+/g, "");

            const filtered = masterData.filter(item => {
                var targetPumbun  = item.pumbunLow     ? String(item.pumbunLow).replace(/\s+/g, "")     : "";
                var targetName    = item.prodNameLow   ? String(item.prodNameLow).replace(/\s+/g, "")   : "";
                var targetSabang  = item.sabangCodeLow ? String(item.sabangCodeLow).replace(/\s+/g, "") : "";
                return targetPumbun.includes(cleanKeyword) || targetName.includes(cleanKeyword) || targetSabang.includes(cleanKeyword);
            });

            const grouped = groupByMainCode(filtered);
            matchCountEl.textContent = filtered.length.toLocaleString();
            groupCountEl.textContent = grouped.size.toLocaleString();

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-20 bg-white rounded-2xl border border-slate-200 shadow-sm">
                        <div class="text-slate-300 text-6xl mb-4"><i class="fa-solid fa-magnifying-glass-minus"></i></div>
                        <h3 class="text-lg font-medium text-slate-900">'${keyword}'에 매칭되는 상품이 없습니다.</h3>
                        <p class="text-slate-400 text-sm mt-1">상품코드, 상품명, 사방넷 품번코드를 확인해 주세요.</p>
                    </div>
                `;
                return;
            }

            let htmlString = "";

            grouped.forEach((variants, mainCode) => {
                const rep = variants[0];
                const linkHref = rep.link && rep.link !== "#" ? rep.link.trim() : null;
                const titleLink = linkHref
                    ? `<a href="${linkHref}" target="_blank" class="hover:text-emerald-600 hover:underline inline-flex items-center gap-1.5">
                            ${mainCode} — ${rep.prodName}
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-400"></i>
                       </a>`
                    : `${mainCode} — ${rep.prodName}`;

                let variantRows = "";
                variants.forEach(v => {
                    variantRows += `
                        <tr class="variant-row text-xs">
                            <td class="py-2 px-3 border-r border-slate-100 font-mono text-slate-600 whitespace-nowrap">${v.pumbun}</td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.color || '-'}</td>
                            <td class="py-2 px-3 border-r border-slate-100 text-slate-400 whitespace-nowrap">${v.sabangCode || '-'}</td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">
                                <span class="px-1.5 py-0.5 rounded text-[10px] font-medium ${v.status.includes('판매중') ? 'bg-emerald-50 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${v.status}</span>
                            </td>
                            <td class="py-2 px-3 border-r border-slate-100 font-bold text-emerald-700 bg-emerald-50/30 whitespace-nowrap">${v.jasa}<div class="text-[10px] text-emerald-500 font-normal">${v.jasaRate}</div></td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.coupang}<div class="text-[10px] text-slate-400">${v.coupangRate}</div></td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.naver}<div class="text-[10px] text-slate-400">${v.naverRate}</div></td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.ohouse}<div class="text-[10px] text-slate-400">${v.ohouseRate}</div></td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.gmarket}<div class="text-[10px] text-slate-400">${v.gmarketRate}</div></td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.ssg}<div class="text-[10px] text-slate-400">${v.ssgRate}</div></td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.lotte}<div class="text-[10px] text-slate-400">${v.lotteRate}</div></td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.artbox}<div class="text-[10px] text-slate-400">${v.artboxRate}</div></td>
                            <td class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">${v.godpeople}<div class="text-[10px] text-slate-400">${v.godpeopleRate}</div></td>
                            <td class="py-2 px-3 text-slate-500 leading-relaxed text-[11px] whitespace-nowrap">${v.delivery}</td>
                        </tr>
                    `;
                });

                htmlString += `
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden hover:shadow-md transition-all">
                    <div class="p-4 flex items-center gap-4 border-b border-slate-100 bg-slate-50/50">
                        <img src="${rep.img}" alt="상품이미지"
                             onerror="this.src='https://placehold.co/64x64?text=No+Img'"
                             class="w-14 h-14 rounded-xl object-cover border border-slate-200 bg-white shadow-sm flex-shrink-0">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap mb-1">
                                <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-100">${rep.regSheet}</span>
                                <span class="text-xs font-medium px-2 py-0.5 rounded bg-slate-200 text-slate-600">중요코드: ${rep.importantCode || '-'}</span>
                                <span class="text-xs text-slate-400">${variants.length}개 옵션</span>
                            </div>
                            <h2 class="text-base font-bold text-slate-900">${titleLink}</h2>
                        </div>
                        <div class="text-right flex-shrink-0">
                            <div class="text-xs text-slate-400 mb-0.5">정산가 (원가)</div>
                            <div>
                                <span class="text-lg font-extrabold text-slate-900">${rep.jungSan}</span>
                                <span class="text-xs text-slate-400 ml-1">(${rep.wonGa})</span>
                            </div>
                        </div>
                    </div>

                    <div class="overflow-x-auto no-scrollbar">
                        <table class="w-full text-center" style="min-width:1100px;">
                            <thead>
                                <tr class="bg-slate-100/70 text-slate-500 text-[11px] font-medium border-b border-slate-200">
                                    <th class="py-2 px-3 border-r border-slate-100 text-left whitespace-nowrap">상품코드</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">색상</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">사방넷</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">상태</th>
                                    <th class="py-2 px-3 border-r border-slate-100 bg-emerald-50/30 text-emerald-700 whitespace-nowrap">자사몰</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">쿠팡</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">네이버</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">오늘의집</th>
                                    <th class="py-2 px-3 border-r border-slate-100 th-wrap">지마켓 / 옥션<br>11번가 / 롯데온</th>
                                    <th class="py-2 px-3 border-r border-slate-100 th-wrap">신세계몰 / GS SHOP<br>현대홈쇼핑</th>
                                    <th class="py-2 px-3 border-r border-slate-100 th-wrap">롯데홈쇼핑 / 홈앤쇼핑<br>CJ온스타일 / 갓피플몰</th>
                                    <th class="py-2 px-3 border-r border-slate-100 th-wrap">아트박스<br>10X10 / 핫트랙스</th>
                                    <th class="py-2 px-3 border-r border-slate-100 whitespace-nowrap">카카오</th>
                                    <th class="py-2 px-3 whitespace-nowrap">배송구분</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${variantRows}
                            </tbody>
                        </table>
                    </div>
                </div>
                `;
            });

            container.innerHTML = htmlString;
        }

        function initInputListener() {
            const inputEl = document.getElementById('searchInput');
            if (inputEl) {
                inputEl.addEventListener('input', (e) => {
                    performSearch(e.target.value);
                });
            }
        }

        window.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
